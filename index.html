<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!--          COVER PAGE           -->
    <!-- ============================= -->

    <section class="cover">

        <div class="cover-content">

            <p class="small-text">
                a little something for you 𐔌*ˊᵕˋ*𐦯

            <h1>
                for <em>elle.</em>

            <!-- RECORD PLAYER -->

                </div>

                    <button id="playButton">
                        ▶
                    </button>

                    </div>

                </div>

            </div>


            <p class="music-note">
                put on the song first. i'll wait. ♡
            </p>


            <div class="buttons">

                <a
                    href="https://open.spotify.com/track/7D0RhFcb3CrfPuTJ0obrod"
                    target="_blank"
                >
                    open in spotify ↗
